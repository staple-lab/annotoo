name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/core/package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Run this workflow from the tag matching the package version.');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack
      - name: Verify packaged licenses and entry points
        run: |
          for package in release-dist/*.tgz; do
            tar -tzf "$package" | grep -qx 'package/LICENSE'
            tar -tzf "$package" | grep -qx 'package/README.md'
            tar -tzf "$package" | grep -qx 'package/dist/index.js'
            tar -tzf "$package" | grep -qx 'package/dist/index.d.ts'
          done
          (cd release-dist && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-dist/* \
            --verify-tag --title "Annotoo $GITHUB_REF_NAME" --notes-file docs/release-notes.md
